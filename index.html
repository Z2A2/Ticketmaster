<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ticketing Platform PWA</title>
    
    <!-- iOS & PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-card: #1E1E1E;
            --bg-light: #FFFFFF;
            --text-white: #FFFFFF;
            --text-muted: #8E8E93;
            --brand-blue: #026CD1;
            --accent-red: #E53935;
            --border-dark: #2A2A2A;
            --border-light: #E5E5EA;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Viewport Container */
        .device-viewport {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: var(--bg-black);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* iOS Top Status Bar */
        .status-bar {
            height: 44px;
            padding: 0 16px 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 13px;
            font-weight: 600;
            background-color: var(--bg-dark);
            z-index: 100;
        }

        .main-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 70px;
        }

        .screen {
            display: none;
            width: 100%;
            min-height: 100%;
        }

        .screen.active {
            display: block;
        }

        /* Header Navigation */
        .screen-header {
            background-color: var(--bg-dark);
            padding: 12px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 90;
            border-bottom: 1px solid var(--border-dark);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 28px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
        }

        .header-action {
            position: absolute;
            right: 0;
            color: var(--text-white);
            font-size: 14px;
            cursor: pointer;
        }

        .header-back {
            position: absolute;
            left: 0;
            font-size: 20px;
            color: var(--brand-blue);
            cursor: pointer;
        }

        /* Bottom iOS Tab Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: var(--bg-dark);
            border-top: 1px solid #1C1C1E;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            width: 20%;
        }

        .nav-item.active {
            color: var(--brand-blue);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        /* Cards Layout */
        .card-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .card-banner {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2A2A2A;
        }

        .card-body {
            padding: 16px;
        }

        .card-date {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-white);
            line-height: 1.2;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-venue {
            font-size: 13px;
            color: #D1D1D6;
        }

        /* Barcode Scanner Details */
        .ticket-detail-view {
            background-color: var(--bg-black);
            min-height: 100%;
        }

        .hero-banner {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .ticket-info-header {
            background-color: var(--bg-card);
            padding: 16px;
        }

        .barcode-section {
            background-color: #FFFFFF;
            color: #000;
            padding: 20px 16px;
            text-align: center;
        }

        .barcode-container {
            width: 100%;
            height: 85px;
            background: #fff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
            overflow: hidden;
            border: 1px solid #E5E5EA;
            border-radius: 6px;
        }

        .barcode-lines {
            width: 90%;
            height: 70%;
            background: repeating-linear-gradient(
                90deg,
                #000 0px, #000 2px,
                #fff 2px, #fff 5px,
                #000 5px, #000 9px,
                #fff 9px, #fff 11px
            );
        }

        .laser-scanner {
            position: absolute;
            top: 0; left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--brand-blue);
            box-shadow: 0 0 10px var(--brand-blue);
            animation: scanLoop 2.2s ease-in-out infinite alternate;
        }

        @keyframes scanLoop {
            0% { left: 4%; }
            100% { left: 92%; }
        }

        .order-meta-card {
            background-color: #FFFFFF;
            color: #000000;
            padding: 16px;
            border-top: 1px solid var(--border-light);
        }

        .seat-grid {
            background-color: #EFEFF4;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 12px;
        }

        .seat-col { display: flex; flex-direction: column; }
        .seat-label { font-size: 10px; font-weight: 700; color: #666; }
        .seat-val { font-size: 17px; font-weight: 800; color: #000; }

        /* Form Controls for Editor Page */
        .editor-form {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-input {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            color: var(--text-white);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }

        .save-btn {
            background-color: var(--brand-blue);
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="device-viewport">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <span>LTE 🔋</span>
        </div>

        <!-- Main Screen Body -->
        <div class="main-content">
            
            <!-- 1. DISCOVER PAGE -->
            <div id="screen-discover" class="screen active">
                <div class="screen-header">
                    <div class="header-top">
                        <span class="header-title">Discover Events</span>
                        <span class="header-action" onclick="switchCountry()">🇺🇸 US</span>
                    </div>
                </div>
                <div class="card-list" id="discover-list"></div>
            </div>

            <!-- 2. FOR YOU PAGE (TICKET EDITOR & MANAGEMENT) -->
            <div id="screen-foryou" class="screen">
                <div class="screen-header">
                    <div class="header-top">
                        <span class="header-title">Ticket Editor & Organizer</span>
                    </div>
                </div>
                <form class="editor-form" onsubmit="saveEvent(event)">
                    <div class="form-group">
                        <label>Event Title</label>
                        <input type="text" id="edit-title" class="form-input" required value="BTS WORLD TOUR 'ARIRANG' IN TORONTO">
                    </div>
                    <div class="form-group">
                        <label>Banner Image URL</label>
                        <input type="text" id="edit-banner" class="form-input" value="https://i.imgur.com/8Q7kY3B.jpg">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="text" id="edit-date" class="form-input" value="SUN • AUG 23, 2026">
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <input type="text" id="edit-time" class="form-input" value="8:00 PM">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Venue Location</label>
                        <input type="text" id="edit-venue" class="form-input" value="Rogers Stadium - Toronto, ON">
                    </div>
                    <div class="form-group">
                        <label>Order Number</label>
                        <input type="text" id="edit-order" class="form-input" value="Order #29000601112694497">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Section</label>
                            <input type="text" id="edit-section" class="form-input" value="N110">
                        </div>
                        <div class="form-group">
                            <label>Row</label>
                            <input type="text" id="edit-row" class="form-input" value="24">
                        </div>
                        <div class="form-group">
                            <label>Seat</label>
                            <input type="text" id="edit-seat" class="form-input" value="14">
                        </div>
                    </div>
                    <button type="submit" class="save-btn">Sync Ticket Details</button>
                </form>
            </div>

            <!-- 3. MY TICKETS PAGE -->
            <div id="screen-mytickets" class="screen">
                <div class="screen-header">
                    <div class="header-top">
                        <span class="header-title">My Events</span>
                        <span class="header-action">Help</span>
                    </div>
                </div>
                <div class="card-list" id="mytickets-list"></div>
            </div>

            <!-- 4. TICKET DETAIL VIEW PAGE -->
            <div id="screen-detail" class="screen">
                <div class="screen-header">
                    <div class="header-top">
                        <span class="header-back" onclick="navigateTo('mytickets')">&larr;</span>
                        <span class="header-title">Ticket Details</span>
                    </div>
                </div>
                <div class="ticket-detail-view">
                    <img id="detail-banner" src="" class="hero-banner" alt="Banner">
                    <div class="ticket-info-header">
                        <div id="detail-date" class="card-date"></div>
                        <div id="detail-title" class="card-title"></div>
                        <div id="detail-venue" class="card-venue"></div>
                    </div>

                    <div class="barcode-section">
                        <div style="font-size: 11px; font-weight: 700; color: #666;">ENTRY BARCODE</div>
                        <div class="barcode-container">
                            <div class="barcode-lines"></div>
                            <div class="laser-scanner"></div>
                        </div>
                        <div style="font-size: 11px; color: #888;">Screenshots will not get you in.</div>
                    </div>

                    <div class="order-meta-card">
                        <div id="detail-order" style="font-size:14px; font-weight:800;"></div>
                        <div class="seat-grid">
                            <div class="seat-col"><span class="seat-label">SECTION</span><span id="detail-section" class="seat-val"></span></div>
                            <div class="seat-col"><span class="seat-label">ROW</span><span id="detail-row" class="seat-val"></span></div>
                            <div class="seat-col"><span class="seat-label">SEAT</span><span id="detail-seat" class="seat-val"></span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. SELL PAGE -->
            <div id="screen-sell" class="screen">
                <div class="screen-header"><div class="header-top"><span class="header-title">Sell Tickets</span></div></div>
                <div style="padding: 24px; text-align: center; color: var(--text-muted);">
                    <p style="font-weight: 700; color: #fff; margin-bottom: 8px;">Resale Eligibility Active</p>
                    <p style="font-size: 13px;">Manage and list tickets directly from your event wallet.</p>
                </div>
            </div>

            <!-- 6. ACCOUNT PAGE -->
            <div id="screen-account" class="screen">
                <div class="screen-header"><div class="header-top"><span class="header-title">My Account</span></div></div>
                <div style="padding: 20px; text-align: center;">
                    <h3 style="margin-bottom: 4px;">Verified Fan</h3>
                    <p style="font-size: 13px; color: var(--text-muted);">user@example.com</p>
                </div>
            </div>

        </div>

        <!-- iOS Bottom Tab Bar -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="navigateTo('discover')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Discover</span>
            </button>
            <button class="nav-item" onclick="navigateTo('foryou')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>For You</span>
            </button>
            <button class="nav-item" onclick="navigateTo('mytickets')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-2-1.46c-1.19.69-2 1.99-2 3.46s.81 2.77 2 3.46V18H4v-2.54c1.19-.69 2-1.99 2-3.46s-.81-2.77-2-3.46V6h16v2.54z"/></svg>
                <span>My Tickets</span>
            </button>
            <button class="nav-item" onclick="navigateTo('sell')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>Sell</span>
            </button>
            <button class="nav-item" onclick="navigateTo('account')">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Account</span>
            </button>
        </div>
    </div>

    <script>
        let currentEvent = {
            title: "BTS WORLD TOUR 'ARIRANG' IN TORONTO",
            banner: "https://i.imgur.com/8Q7kY3B.jpg",
            date: "SUN • AUG 23, 2026",
            time: "8:00 PM",
            venue: "Rogers Stadium - Toronto, ON",
            order: "Order #29000601112694497",
            section: "N110",
            row: "24",
            seat: "14"
        };

        function renderApp() {
            const cardMarkup = `
                <div class="event-card" onclick="navigateTo('detail')">
                    <img src="${currentEvent.banner}" class="card-banner" alt="Banner">
                    <div class="card-body">
                        <div class="card-date">${currentEvent.date} • ${currentEvent.time}</div>
                        <div class="card-title">${currentEvent.title}</div>
                        <div class="card-venue">${currentEvent.venue}</div>
                    </div>
                </div>
            `;
            document.getElementById('discover-list').innerHTML = cardMarkup;
            document.getElementById('mytickets-list').innerHTML = cardMarkup;

            document.getElementById('detail-banner').src = currentEvent.banner;
            document.getElementById('detail-date').innerText = `${currentEvent.date} • ${currentEvent.time}`;
            document.getElementById('detail-title').innerText = currentEvent.title;
            document.getElementById('detail-venue').innerText = currentEvent.venue;
            document.getElementById('detail-order').innerText = currentEvent.order;
            document.getElementById('detail-section').innerText = currentEvent.section;
            document.getElementById('detail-row').innerText = currentEvent.row;
            document.getElementById('detail-seat').innerText = currentEvent.seat;
        }

        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            const targetScreen = document.getElementById(`screen-${screenId}`);
            if (targetScreen) targetScreen.classList.add('active');

            const navIndexMap = { 'discover': 0, 'foryou': 1, 'mytickets': 2, 'sell': 3, 'account': 4 };
            if (navIndexMap[screenId] !== undefined) {
                document.querySelectorAll('.nav-item')[navIndexMap[screenId]].classList.add('active');
            }
        }

        function saveEvent(e) {
            e.preventDefault();
            currentEvent.title = document.getElementById('edit-title').value;
            currentEvent.banner = document.getElementById('edit-banner').value;
            currentEvent.date = document.getElementById('edit-date').value;
            currentEvent.time = document.getElementById('edit-time').value;
            currentEvent.venue = document.getElementById('edit-venue').value;
            currentEvent.order = document.getElementById('edit-order').value;
            currentEvent.section = document.getElementById('edit-section').value;
            currentEvent.row = document.getElementById('edit-row').value;
            currentEvent.seat = document.getElementById('edit-seat').value;

            renderApp();
            navigateTo('mytickets');
        }

        function switchCountry() {
            alert('Region setting updated.');
        }

        renderApp();
    </script>
</body>
</html>
